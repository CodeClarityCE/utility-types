# Go library CI from the central workflows; see CodeClarityCE/.github.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    uses: CodeClarityCE/.github/.github/workflows/go-library.yml@v1
    permissions:
      contents: write # release job only; it runs on main when CI_RELEASE is true

  # The required check, kept here because called jobs show as "go / <job>".
  ci:
    needs: [go]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULT: ${{ needs.go.result }}
        run: '[[ "$RESULT" == success ]] || { echo "::error::go did not succeed: $RESULT"; exit 1; }'
